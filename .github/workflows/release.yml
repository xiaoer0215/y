name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  AI_HELPER_BRAND_ID: ${{ github.event.repository.name == 'u' && 'uocode' || github.event.repository.name == 'n' && 'nez-api' || 'yusr' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: darwin-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: darwin-x86_64
            os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      - name: Select and validate brand
        run: |
          node scripts/select-brand.mjs
          pnpm validate:brands
          pnpm typecheck
      - name: Test Windows backend
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis
      - name: Build macOS packages
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg
      - name: Collect packages
        run: node scripts/package-client.mjs ${{ matrix.platform }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.platform }}
          path: release/assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          pattern: client-*
          path: release/assets
          merge-multiple: true
      - name: Verify packages and generate update manifest
        run: node scripts/package-client.mjs manifest
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "${GITHUB_REPOSITORY##*/} $tag" --notes-file "docs/releases/$tag.md" --draft
          fi
          gh release upload "$tag" release/assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "docs/releases/$tag.md" --draft=false --latest
